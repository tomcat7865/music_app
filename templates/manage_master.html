{% extends "layout.html" %}
{% block content %}
<div style="margin-bottom: 20px;">
    <a href="/data_entry" style="color: #666; text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Data Entry Menu</a>
</div>

<div class="search-section" style="max-width: 1100px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333;">
    <h2 style="color: #28a745; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px;">Manage Master Release</h2>
    <p style="color: #666; font-size: 0.8rem; margin-bottom: 30px;">Enter an ID and click 'Load' to edit, or leave blank for a new record.</p>

    <form action="/data_entry/master/save" method="POST">
        
        <div style="display: grid; grid-template-columns: 140px 120px 1fr 1fr; gap: 15px; background: #000; padding: 20px; border-radius: 4px; border: 1px solid #222; margin-bottom: 30px; align-items: end;">
            <div>
                <label style="display:block; color:#28a745; font-size:0.7rem; font-weight:bold; margin-bottom:5px;">MASTER ID</label>
                <input type="number" name="id" id="lookup_id" placeholder="Auto" style="width:100%; padding:10px; background:#111; border:1px solid #444; color:#fff; border-radius:4px;">
            </div>
            <div>
                <button type="button" id="load_btn" style="width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.7rem; height:38px; text-transform: uppercase;">LOAD</button>
            </div>
            <div>
                <label style="display:block; color:#666; font-size:0.7rem; font-weight:bold; margin-bottom:5px;">IDENTITY (ARTIST)</label>
                <div id="display_artist" style="padding:10px; color:#aaa; font-style:italic; border-bottom: 1px solid #222;">--</div>
            </div>
            <div>
                <label style="display:block; color:#666; font-size:0.7rem; font-weight:bold; margin-bottom:5px;">ALBUM CONFIRMATION</label>
                <div id="display_album" style="padding:10px; color:#aaa; font-style:italic; border-bottom: 1px solid #222;">--</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">ARTIST</label>
                <select name="artist_id" id="artist_id" required style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">-- Select Artist --</option>
                    {% for a in artists %}<option value="{{ a.id }}">{{ a.artist }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">ALBUM</label>
                <select name="album_id" id="album_id" required style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">-- Select Album --</option>
                    {% for alb in albums %}<option value="{{ alb.album_id }}">{{ alb.album }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">LABEL</label>
                <select name="label_id" id="label_id" required style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">-- Select Label --</option>
                    {% for l in labels %}<option value="{{ l.id }}">{{ l.label }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">CATALOGUE #</label>
                <select name="catalogue_no_id" id="catalogue_no_id" style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">-- None --</option>
                    {% for c in cats %}<option value="{{ c.id }}">{{ c.catalogue_number }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">PHYSICAL FORMAT</label>
                <select name="physical_format_type_id" id="physical_format_type_id" required style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#eee;">
                    {% for f in formats %}<option value="{{ f.id }}">{{ f.physical_format_type }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">ORIGINAL YEAR</label>
                <select name="original_release_year_id" id="original_release_year_id" style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#eee;">
                    {% for y in years %}<option value="{{ y.id }}">{{ y.release_year }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <h3 style="color:#555; font-size:0.7rem; text-transform:uppercase; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:20px;">Archive & Media Specs</h3>
        
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px;">
            <div>
                <label style="display:block; color:#888; font-size:0.65rem; margin-bottom:5px;">RETAIL DISC?</label>
                <select name="retail_disc_id" id="retail_disc_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    {% for y in yn %}<option value="{{ y.id }}">{{ y.yes_no }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.65rem; margin-bottom:5px;">THIS RELEASE YEAR</label>
                <input type="text" name="this_release_year" id="this_release_year" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#fff;">
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.65rem; margin-bottom:5px;">DURATION</label>
                <input type="text" name="this_release_duration" id="this_release_duration" placeholder="00:00:00" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#fff;">
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.65rem; margin-bottom:5px;">AVG DR</label>
                <input type="number" step="0.1" name="average_dynamic_range" id="average_dynamic_range" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#fff;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px;">
            <div>
                <label style="display:block; color:#888; font-size:0.65rem; margin-bottom:5px;">CDR BRAND</label>
                <select name="cdr_brand_id" id="cdr_brand_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">-- N/A --</option>
                    {% for b in brands %}<option value="{{ b.id }}">{{ b.disc_brand }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.65rem; margin-bottom:5px;">CDR CODE</label>
                <select name="cdr_code_id" id="cdr_code_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">-- N/A --</option>
                    {% for c in cdr_codes %}<option value="{{ c.id1 }}">{{ c.cdr_code }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.65rem; margin-bottom:5px;">DVDR CODE</label>
                <select name="dvdr_code_id" id="dvdr_code_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">-- N/A --</option>
                    {% for d in dvd_codes %}<option value="{{ d.id }}">{{ d.bdr_dvdr_code }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.65rem; margin-bottom:5px;">WRITING DEVICE</label>
                <select name="disc_writing_device_id" id="disc_writing_device_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">-- Select Device --</option>
                    {% for dev in devices %}<option value="{{ dev.id }}">{{ dev.disc_writing_device }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div style="margin-bottom: 30px;">
            <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:10px; text-transform: uppercase;">Note 1 (General Archive Info)</label>
            <textarea name="notes_1" id="notes_1" rows="4" placeholder="Enter primary release notes..." style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:4px; font-family:inherit; margin-bottom:20px; resize: vertical;"></textarea>

            <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:10px; text-transform: uppercase;">Note 2 (Technical Details / Tracklist)</label>
            <textarea name="notes_2" id="notes_2" rows="12" placeholder="Enter technical metadata or tracklistings..." style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:4px; font-family:inherit; margin-bottom:20px; resize: vertical;"></textarea>

            <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:10px; text-transform: uppercase;">Note 3 (Condition / Provenance)</label>
            <textarea name="notes_3" id="notes_3" rows="12" placeholder="Enter condition reports or additional history..." style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:4px; font-family:inherit; resize: vertical;"></textarea>
        </div>

        <button type="submit" style="width: 100%; background: #28a745; color: white; border: none; padding: 18px; cursor: pointer; border-radius: 4px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">
            Commit to Archive
        </button>
    </form>
</div>

<script>
// 1. THE LOAD BUTTON LOGIC
document.getElementById('load_btn').addEventListener('click', function() {
    const mId = document.getElementById('lookup_id').value;
    if (!mId) { alert("Please enter a Master ID first"); return; }

    fetch(`/api/get_master_details?id=${mId}`)
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                alert("ID not found in database");
                return;
            }

            // Populate Identity Headers
            document.getElementById('display_artist').innerText = data.artist || "Unknown";
            document.getElementById('display_album').innerText = data.album || "Unknown";
            document.getElementById('display_artist').style.color = '#28a745';

            // Populate Form Fields automatically by ID
            for (let key in data) {
                let el = document.getElementById(key);
                if (el) {
                    el.value = data[key];
                }
            }
        })
        .catch(err => console.error("Load Error:", err));
});

// 2. THE VISUAL IDENTITY CHECK (Triggers while typing)
document.getElementById('lookup_id').addEventListener('input', function() {
    const mId = this.value;
    const artistBox = document.getElementById('display_artist');
    const albumBox = document.getElementById('display_album');

    if (mId.length > 0) {
        fetch(`/api/get_master_details?id=${mId}`)
            .then(res => res.json())
            .then(data => {
                if (data.album) {
                    artistBox.innerText = data.artist;
                    albumBox.innerText = data.album;
                    artistBox.style.color = '#28a745';
                } else {
                    artistBox.innerText = "ID Not Found";
                    albumBox.innerText = "New Record Mode";
                    artistBox.style.color = '#666';
                }
            });
    } else {
        artistBox.innerText = "--";
        albumBox.innerText = "--";
        artistBox.style.color = '#aaa';
    }
});
</script>
{% endblock %}
