{% extends "layout.html" %}
{% block content %}
<div style="margin-bottom: 20px;">
    <a href="/data_entry" style="color: #666; text-decoration: none; font-size: 0.9rem;">
        <i class="fas fa-arrow-left"></i> Back to Data Entry Menu
    </a>
</div>

<div class="search-section" style="max-width: 1200px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333;">
    <h2 style="color: #28a745; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;">Other Version Entry</h2>

    <form action="/data_entry/version/save" method="POST">
        
        <div style="display: grid; grid-template-columns: 140px 120px 140px 1fr; gap: 20px; background: #000; padding: 15px; border-radius: 4px; border: 1px solid #222; margin-bottom: 25px; align-items: end;">
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; font-weight:bold; margin-bottom:5px;">VERSION ID</label>
                <input type="number" name="id" id="id" placeholder="Auto" style="width:100%; padding:8px; background:#111; border:1px solid #444; color:#fff; border-radius:4px;">
            </div>
            <div>
                <button type="button" id="load_version" style="width:100%; height:35px; background: #28a745; color:#fff; border:none; cursor:pointer; border-radius:4px; font-weight:bold; font-size:0.75rem; text-transform:uppercase;">LOAD</button>
            </div>
            <div>
                <label style="display:block; color:#28a745; font-size:0.7rem; font-weight:bold; margin-bottom:5px;">MASTER ID</label>
                <input type="number" name="master_release_entry_id" id="master_release_entry_id" required placeholder="Required" style="width:100%; padding:8px; background:#111; border:1px solid #28a745; color:#fff; border-radius:4px;">
            </div>
            <div id="master_confirm" style="color:#aaa; font-style:italic; font-size:0.9rem; padding-bottom:8px; border-bottom:1px solid #222; margin-left: 10px;">-- Confirm Master --</div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px;">
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">BIT DEPTH</label>
                <select name="bit_depth_id" id="bit_depth_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">--</option>
                    {% for b in bits %}<option value="{{ b.id }}">{{ b.bit_depth }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">SAMPLE RATE</label>
                <select name="sample_rate_id" id="sample_rate_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">--</option>
                    {% for r in rates %}<option value="{{ r.id }}">{{ r.sample_rate }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">DIGITAL FORMAT</label>
                <select name="digital_format_type_id" id="digital_format_type_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">--</option>
                    {% for d in digi_formats %}<option value="{{ d.id }}">{{ d.digital_format_type }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">PHYSICAL FORMAT</label>
                <select name="physical_format_type_id" id="physical_format_type_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">--</option>
                    {% for f in phys_formats %}<option value="{{ f.id }}">{{ f.physical_format_type }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px;">
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">LABEL</label>
                <select name="label_id" id="label_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">--</option>
                    {% for l in labels %}<option value="{{ l.id }}">{{ l.label }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">CATALOGUE #</label>
                <select name="catalogue_no_id" id="catalogue_no_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">--</option>
                    {% for c in cats %}<option value="{{ c.id }}">{{ c.catalogue_number }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">RELEASE YEAR</label>
                <select name="this_release_year_id" id="this_release_year_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">--</option>
                    {% for y in years %}<option value="{{ y.id }}">{{ y.release_year }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">LOCATION</label>
                <select name="storage_location_id" id="storage_location_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    <option value="">--</option>
                    {% for loc in locations %}<option value="{{ loc.id }}">{{ loc.storage_location }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px;">
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">DURATION</label>
                <input type="text" name="duration" id="duration" placeholder="00:00:00" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#fff; border-radius:4px;">
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">AVG DR</label>
                <input type="number" step="0.1" name="average_dynamic_range" id="average_dynamic_range" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#fff; border-radius:4px;">
            </div>
            <div>
                <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">BOOKLET AVAILABLE?</label>
                <select name="booklet_available_id" id="booklet_available_id" style="width:100%; padding:8px; background:#000; border:1px solid #333; color:#eee;">
                    {% for y in yn %}<option value="{{ y.id }}">{{ y.yes_no }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label style="display:block; color:#888; font-size:0.7rem; margin-bottom:5px;">INDIVIDUAL COMMENT</label>
            <textarea name="individual_comment" id="individual_comment" rows="4" style="width:100%; padding:10px; background:#000; border:1px solid #333; color:#fff; border-radius:4px; font-family:inherit; resize:vertical;"></textarea>
        </div>

        <button type="submit" style="width:100%; background:#28a745; color:#fff; border:none; padding:15px; margin-top:20px; font-weight:bold; font-size:1rem; cursor:pointer; border-radius:4px; text-transform:uppercase; letter-spacing:1px;">COMMIT TO ARCHIVE</button>
    </form>
</div>

<script>
// AJAX to show Album Name when Master ID is entered
document.getElementById('master_release_entry_id').addEventListener('input', function() {
    const mId = this.value;
    const confirmBox = document.getElementById('master_confirm');
    if (!mId) { confirmBox.innerText = "--"; return; }
    fetch(`/api/get_master_details?id=${mId}`)
        .then(res => res.json())
        .then(data => {
            confirmBox.innerText = data.album ? data.artist + " - " + data.album : "ID Not Found";
            confirmBox.style.color = data.album ? '#28a745' : '#dc3545';
        });
});

// Load Version
document.getElementById('load_version').addEventListener('click', function() {
    const vId = document.getElementById('id').value;
    if (!vId) return;
    fetch(`/api/get_version_details?id=${vId}`)
        .then(res => res.json())
        .then(data => {
            if (data.error) { alert("Not found"); return; }
            for (let key in data) {
                let el = document.getElementById(key);
                if (el) el.value = data[key];
            }
            // Trigger the album name lookup
            document.getElementById('master_release_entry_id').dispatchEvent(new Event('input'));
        });
});
</script>
{% endblock %}
